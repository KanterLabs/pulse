<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="pulse-icon-title pulse-icon-description"
     focusable="false">
  <title id="pulse-icon-title">Pulse</title>
  <desc id="pulse-icon-description">A bright heartbeat waveform in a quiet green command window.</desc>

  <!-- Deep green-charcoal grounds the mark on both light and dark desktops. -->
  <rect width="512" height="512" rx="112" fill="#10231f"/>
  <rect x="44" y="44" width="424" height="424" rx="88"
        fill="#17382f" stroke="#2f5b4b" stroke-width="8"/>

  <!-- A single, open waveform makes the mark read as Pulse without imitating a music service mark. -->
  <path d="M88 282h49c10 0 18-6 22-16l26-70c5-14 25-14 30 1l35 127c5 18 27 18 32-1l36-148c5-20 34-20 39 1l20 82c3 14 15 24 30 24h45"
        fill="none"
        stroke="#f4f7f2"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- The restrained accent marks the active beat. -->
  <path d="M198 212l22 112c4 21 30 21 36 1l36-148c5-20 34-20 39 1l20 82"
        fill="none"
        stroke="#86dfaa"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="88" cy="282" r="14" fill="#86dfaa"/>
  <circle cx="424" cy="282" r="14" fill="#86dfaa"/>
</svg>
